<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Submissions | Unison</title>
    <script>
        const theme = localStorage.getItem('unisonTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
    <link rel="stylesheet" href="styles.css">
</head>

<body id="page-submissions">

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="logo.svg" alt="Unison">
                <div class="logo-text">
                    <h1>Unison</h1><span>Community Lyrics</span>
                </div>
            </a>
            <nav class="nav-links">
                <a href="index.html">Search</a>
                <a href="submissions.html" class="active">My Submissions</a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="submit.html" class="btn btn-primary"><span class="fluent-icon"></span> <span
                    class="hide-mobile">Submit Lyrics</span></a>
            <a href="account.html" class="btn btn-icon"><span class="fluent-icon"></span></a>
        </div>
    </header>

    <main>
        <div class="page-header animate-fade-up">
            <h2 id="search-header">My Submissions</h2>
        </div>
        <div class="info-bar animate-fade-up">
            <span class="fluent-icon"></span>
            <span>Due to API limitations, Only the latest 50 submissions are displayed.</span>
        </div>
        <div class="cards-grid" id="search-results"></div>
    </main>

    <div id="toast-container"></div>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
