<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyric Details | Unison</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="page-detail">

    <header class="top-nav">
        <div class="nav-left">
            <a href="index.html" class="logo">
                <img src="https://better-lyrics.boidu.dev/icons/logo.svg" alt="Unison">
                <div class="logo-text">
                    <h1>Unison</h1>
                    <span>Lyric Inspector</span>
                </div>
            </a>
            <nav class="nav-links">
                <a href="index.html" id="nav-search">Search</a>
                <a href="submissions.html" id="nav-submissions">My Submissions</a>
            </nav>
        </div>
        <div class="nav-right">
            <a href="javascript:history.back()" class="btn"><span class="material-symbols-rounded">arrow_back</span> Back</a>
        </div>
    </header>

    <main class="animate-fade-up">
        <div class="detail-container">
            
            <!-- Unified Header Section -->
            <div class="header-card panel">
                <div class="header-info">
                    <h2 id="det-title">Loading...</h2>
                    <p id="det-artist" class="text-secondary">Loading...</p>
                    <div class="badges-row">
                        <span class="badge"><span class="material-symbols-rounded" style="font-size: 14px; vertical-align: middle; margin-right: 4px;">code</span> <span id="det-format">--</span></span>
                        <span class="badge"><span class="material-symbols-rounded" style="font-size: 14px; vertical-align: middle; margin-right: 4px;">sync</span> <span id="det-sync">--</span></span>
                        <span class="badge"><span class="material-symbols-rounded" style="font-size: 14px; vertical-align: middle; margin-right: 4px;">translate</span> <span id="det-lang">--</span></span>
                    </div>
                </div>
                <div class="score-box">
                    <div class="vote-score" id="det-score">0.0</div>
                    <div class="text-secondary" id="det-votecount" style="font-size: 0.85rem; font-weight: 600;">0 votes</div>
                </div>
            </div>

            <!-- Enhanced Action Bar -->
            <div class="action-bar">
                <button class="btn" onclick="submitVote(1)">
                    <span class="material-symbols-rounded">thumb_up</span> Upvote
                </button>
                <button class="btn" onclick="submitVote(-1)">
                    <span class="material-symbols-rounded">thumb_down</span> Downvote
                </button>
                <button class="btn" onclick="downloadLyrics()">
                    <span class="material-symbols-rounded">download</span> Download File
                </button>
                <button class="btn btn-danger" onclick="document.getElementById('report-dialog').showModal()">
                    <span class="material-symbols-rounded">flag</span> Report Issue
                </button>
            </div>

            <!-- Content Area (Side-by-side Desktop, Stacked Mobile) -->
            <div class="content-grid">
                
                <!-- Preview Panel -->
                <div class="panel scrollable-panel">
                    <div class="panel-header flex-between">
                        <label class="section-label" style="margin: 0;">Parsed Preview</label>
                        <span class="material-symbols-rounded text-muted">visibility</span>
                    </div>
                    <div class="panel-body">
                        <div id="det-preview"></div>
                    </div>
                </div>

                <!-- Raw Panel -->
                <div class="panel scrollable-panel">
                    <div class="panel-header flex-between">
                        <label class="section-label" style="margin: 0;">Raw Payload</label>
                        <button class="btn btn-small" onclick="copyRawLyrics()">
                            <span class="material-symbols-rounded" style="font-size: 16px;">content_copy</span> Copy Raw
                        </button>
                    </div>
                    <div class="panel-body">
                        <div id="det-raw"></div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Report Dialog -->
    <dialog id="report-dialog">
        <h3 style="margin-bottom: 16px; font-size: 1.5rem; letter-spacing: -0.02em;">Report Lyrics</h3>
        <p class="text-secondary mb-3" style="font-size: 0.9rem;">Help us keep Unison accurate by reporting incorrect or malicious uploads.</p>
        
        <div class="form-group">
            <label>Reason for report</label>
            <select id="report-reason" class="input-element">
                <option value="wrong_song">Wrong Song</option>
                <option value="bad_sync">Bad Synchronization</option>
                <option value="offensive">Offensive Content</option>
                <option value="spam">Spam / Junk</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Additional Details (Optional)</label>
            <textarea id="report-details" class="input-element" rows="3" placeholder="Provide more context..."></textarea>
        </div>
        <div class="flex-between mt-3">
            <button class="btn" onclick="document.getElementById('report-dialog').close()">Cancel</button>
            <button class="btn btn-danger" onclick="submitReport()">Submit Report</button>
        </div>
    </dialog>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <footer class="app-footer">
        <div class="flex-center gap-1 text-muted" style="font-size: 0.85rem; font-weight: 500;">
            Made by Walker
            <img src="https://github.com/DarkForceFREEFIRE/unison-web/blob/main/logo.png?raw=true" alt="Walker Logo" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover;">
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
