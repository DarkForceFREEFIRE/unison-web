<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Unison</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex-center" style="height: 100vh;">
    
    <div class="panel animate-fade-up" style="max-width: 400px; width: 100%; text-align: center;">
        <img src="https://better-lyrics.boidu.dev/icons/logo.svg" alt="Logo" style="width: 56px; margin-bottom: 16px;">
        <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Unison Publisher</h2>
        <p class="text-secondary mb-2" style="font-size: 0.9rem;">Login to your Better Lyrics account</p>
        
        <button class="btn btn-primary btn-full mt-2" onclick="document.getElementById('identity-file').click()">
            <span class="material-symbols-rounded">upload_file</span> Upload Identity JSON
        </button>
        <input type="file" id="identity-file" accept=".json" style="display:none;" onchange="handleIdentityUpload(event)">
        
        <hr>
        
        <button class="btn btn-full" onclick="loginDefault()">
            <span class="material-symbols-rounded">public</span> Use Public Account
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
