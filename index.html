<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unison Publisher</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    
    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <img src="resources/LoginIcon.svg" width="72" height="72" class="login-icon">
        <h1>Unison Publisher</h1>
        <p>Login to your Better Lyrics account</p>
        
        <div class="fluent-panel" style="margin-top: 32px;">
            <!-- Primary button requires a dark icon to contrast against the white button -->
            <button class="btn btn-primary btn-full" id="btn-upload-identity">
                <img src="resources/UploadBetterLrcCredintials.svg" width="18" height="18" style="filter: brightness(0); vertical-align: middle; margin-right: 8px;"> Upload Identity JSON
            </button>
            <input type="file" id="identity-file" accept=".json">
            
            <div class="divider">OR</div>
            
            <!-- Secondary button requires a white icon to contrast against dark glass -->
            <button class="btn btn-full" id="btn-default-login">
                <img src="resources/UseDefaultLogin.svg" width="18" height="18" style="filter: brightness(0) invert(1); vertical-align: middle; margin-right: 8px;"> Use Default (MysticSnareRise)
            </button>
        </div>
    </div>

    <!-- APP SCREEN -->
    <div id="app-screen">
        
        <div class="user-badge">
            Logged in as: <strong id="display-name">User</strong>
            <span class="logout-link" id="btn-logout">Logout</span>
        </div>

        <div class="tabs">
            <!-- In YouTube style, Active tab has a dark icon (white bg), inactive tabs have white icons (dark bg) -->
            <button class="tab active" data-target="publish" id="tab-btn-publish">
                <img src="resources/Publish_Tab_Icon.svg" width="18" height="18" class="tab-icon" style="filter: brightness(0); vertical-align: middle; margin-right: 8px;"> Publish Lyrics
            </button>
            <button class="tab" data-target="check" id="tab-btn-check">
                <img src="resources/Music.svg" width="18" height="18" class="tab-icon" style="filter: brightness(0) invert(1); vertical-align: middle; margin-right: 8px;"> My Submissions
            </button>
        </div>

        <div class="fluent-panel">
            <!-- PUBLISH TAB -->
            <div id="tab-publish" class="tab-content active">
                <div class="form-group">
                    <label>Video ID</label>
                    <input type="text" id="vid" placeholder="e.g. dQw4w9WgXcQ">
                </div>
                <div class="form-group">
                    <label>Song Title</label>
                    <input type="text" id="song" placeholder="Never Gonna Give You Up">
                </div>
                <div class="form-group">
                    <label>Artist</label>
                    <input type="text" id="artist" placeholder="Rick Astley">
                </div>
                <div class="form-group">
                    <label>Duration</label>
                    <input type="text" id="dur" placeholder="Seconds or MM:SS (e.g. 213 or 3:33)">
                </div>
                <div class="form-group">
                    <label>Album <span style="color: var(--text-secondary); font-weight: 400;">(Optional)</span></label>
                    <input type="text" id="album" placeholder="Whenever You Need Somebody">
                </div>
                
                <div class="form-group" style="margin-top: 32px; display: flex; align-items: center;">
                    <label class="btn file-label" id="btn-browse-lyrics">
                        <img src="resources/UploadLyricsFile.svg" width="18" height="18" style="filter: brightness(0) invert(1); vertical-align: middle; margin-right: 8px;"> Browse .lrc / .ttml
                    </label>
                    <span id="selected-file-name" class="text-secondary">No file selected</span>
                    <input type="file" id="lyrics-file" accept=".lrc,.ttml">
                </div>

                <button class="btn btn-primary btn-full" id="btn-publish" style="margin-top: 16px;">
                    <img src="resources/Publish_Tab_Icon.svg" width="18" height="18" style="filter: brightness(0); vertical-align: middle; margin-right: 8px;"> Publish to Unison
                </button>

                <div id="status-msg"></div>
            </div>

            <!-- CHECK TAB -->
            <div id="tab-check" class="tab-content">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 16px;">
                    <button class="btn" id="btn-refresh">
                        <img src="resources/Refresh.svg" width="16" height="16" style="filter: brightness(0) invert(1); vertical-align: middle; margin-right: 8px;"> Refresh
                    </button>
                </div>
                <div class="table-container">
                    <table id="lyrics-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Song</th>
                                <th>Artist</th>
                                <th>Format</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Content loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // Minimal JS to handle the YouTube style tab icon inversions natively
    // Note: You can append this logic into your main.js file
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            // Reset all tab icons to white (inactive)
            document.querySelectorAll('.tab .tab-icon').forEach(icon => {
                icon.style.filter = 'brightness(0) invert(1)';
            });
            
            // Set clicked tab icon to black (active state uses white background)
            const activeIcon = tab.querySelector('.tab-icon');
            if (activeIcon) {
                activeIcon.style.filter = 'brightness(0)';
            }
        });
    });
</script>
<!-- Use type="module" to enable modern JavaScript imports -->
<script type="module" src="js/main.js"></script>
</body>
</html>
